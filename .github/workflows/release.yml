name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify signing secrets
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ERROR: secret KEYSTORE_BASE64 is not set"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ERROR: secret KEYSTORE_PASSWORD is not set"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: secret KEY_ALIAS is not set"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: secret KEY_PASSWORD is not set"; exit 1; }
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Compute version code
        id: versioncode
        run: echo "code=$(( $(date +%s) / 60 ))" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kpaper-release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease -PversionName=${{ inputs.version }} -PversionCode=${{ steps.versioncode.outputs.code }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kpaper-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        run: |
          gh release create v${{ inputs.version }} \
            --title "Kpaper v${{ inputs.version }}" \
            --generate-notes \
            app/build/outputs/apk/release/app-release.apk
        env:
          GH_TOKEN: ${{ github.token }}
